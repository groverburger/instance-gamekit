[package]
name = "instance-art"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Pixel art as text (.art files -> sprites and backgrounds), contact sheets and art checks for agents writing GameMaker 8.1 games"

[dependencies]
instance-format.workspace = true
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "gmk-art"
path = "src/bin/gmk-art.rs"
